server:
  port: ${SERVER_PORT:8080}

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: cliente-ms
              uri: lb://cliente-ms
              predicates:
                - Path=/api/v1/clientes/**
            - id: servicio-legal-ms
              uri: lb://servicio-legal-ms
              predicates:
                - Path=/api/v1/servicios/**
            - id: orden-legal-ms
              uri: lb://orden-legal-ms
              predicates:
                - Path=/api/v1/ordenes/**
            - id: pago-ms
              uri: lb://pago-ms
              predicates:
                - Path=/api/v1/pagos/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://legal-eureka:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${EUREKA_INSTANCE_ID:legal-gateway:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
