services:
  postgres:
    image: postgres:16-alpine
    container_name: illari-u1-postgres-dev
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: illari_cliente
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - illari_u1_postgres_dev:/var/lib/postgresql/data
      - ./database/init-u1-databases.sh:/docker-entrypoint-initdb.d/01-init-u1-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  illari_u1_postgres_dev:
